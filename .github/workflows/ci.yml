name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      # 多模块全量编译打包；RabbitMQ/MySQL 集成测试需要外部服务，CI 只跑无依赖的 core/spi 单测
      - name: Build (all modules)
        run: mvn -B package -DskipTests --file pom.xml
      - name: Unit tests (core & spi)
        run: mvn -B test -pl outboxpro-core,outboxpro-spi --file pom.xml
